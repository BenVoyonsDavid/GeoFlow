services:
  postgres:
    image: postgres:18
    container_name: geoflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geoflow
    ports:
      - "5432:5432"
    volumes:
      - geoflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geoflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  geoflow_postgres_data:
